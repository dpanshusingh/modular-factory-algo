# Notes
query GetNotes @auth(level: PUBLIC) {
  notes {
    id
    inspectionItemId
    taskId
    travelerId
    text
    type
  }
}

query GetNotesByTraveler($travelerId: UUID!) @auth(level: PUBLIC) {
  notes(where: { travelerId: { eq: $travelerId } }) {
    id
    inspectionItemId
    taskId
    travelerId
    text
    type
  }
}

# Traveler Templates
query GetTravelerTemplates @auth(level: PUBLIC) {
  travelerTemplates {
    id
    name
  }
}

# Stations
query GetStations @auth(level: PUBLIC) {
  stations {
    id
    taskTemplateId
    name
    order
    doesReceiveTravelers
  }
}

query GetStationById($id: UUID!) @auth(level: PUBLIC) {
  station(id: $id) {
    id
    taskTemplateId
    name
    order
    doesReceiveTravelers
  }
}

# Travelers
query GetTraveler @auth(level: PUBLIC) {
  travelers {
    id
    isShipped
    notesRequiredUpload
    serialNumber
  }
}

query GetTravelerById($id: UUID!) @auth(level: PUBLIC) {
  traveler(id: $id) {
    id
    moduleProfileId
    travelerTemplateId
    isShipped
    notesRequiredUpload
    serialNumber
  }
}

# Traveler Stations
query GetTravelerStations @auth(level: PUBLIC) {
  travelerStations {
    id
    stationId
    travelerId
    leadInspectionProgress
    qamInspectionProgress
    taskProgress
    isCurrent
  }
}

query GetTravelerStationsByTraveler($travelerId: UUID!) @auth(level: PUBLIC) {
  travelerStations(where: { travelerId: { eq: $travelerId } }) {
    id
    stationId
    travelerId
    leadInspectionProgress
    qamInspectionProgress
    taskProgress
    isCurrent
  }
}

query GetCurrentTravelerStations($travelerId: UUID!) @auth(level: PUBLIC) {
  travelerStations(where: { travelerId: { eq: $travelerId }, isCurrent: { eq: true } }) {
    id
    stationId
    travelerId
    leadInspectionProgress
    qamInspectionProgress
    taskProgress
    isCurrent
  }
}

query GetTravelerStationsQamProgress($stationId: UUID!) @auth(level: PUBLIC) {
  travelerStations(where: { stationId: { eq: $stationId } }) {
    id
    qamInspectionProgress
  }
}

# Projects
query GetAllProjects @auth(level: PUBLIC) {
  projects {
    id
    name
  }
}

# ✅ FIXED VERSION
query GetProjectById($id: UUID!) @auth(level: PUBLIC) {
  project(id: $id) {
    id
    name
  }
}
