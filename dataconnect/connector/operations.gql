# ------------------------
# Queries
# ------------------------

query GetAllUsers {
  users: User {
    id
    email
    firstname
    lastname
    role
    createdAt
  }
}

query GetUserByEmail($email: String!) {
  user: User(where: { email: { eq: $email } }) {
    id
    email
    firstname
    lastname
    role
  }
}

query GetEmployees {
  employees: Employee {
    id
    name
    email
    crews
    createdAt
  }
}

query GetTimelogs {
  timelogs: Timelog {
    id
    employee {
      id
      name
      email
    }
    startTime
    endTime
    description
  }
}

# ------------------------
# Mutations
# ------------------------

mutation CreateUser(
  $email: String!
  $firstname: String!
  $lastname: String!
  $role: String!
) {
  createUser: UserInsert(input: {
    email: $email
    firstname: $firstname
    lastname: $lastname
    role: $role
  }) {
    id
    email
  }
}

mutation CreateEmployee(
  $name: String!
  $email: String
  $crews: [String]
) {
  createEmployee: EmployeeInsert(input: {
    name: $name
    email: $email
    crews: $crews
  }) {
    id
    name
    email
  }
}

# Health check query (fixes the deployment warning)
query healthCheck @auth(level: NO_ACCESS) {
  _healthCheck: Boolean
}